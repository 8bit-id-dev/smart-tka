<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Daftar - SMART-TKA</title>

                      "on-surface-variant": "#3f4948",
                      "on-secondary": "#ffffff",
                      "primary-container": "#0f6b6b",
                      "inverse-on-surface": "#cbfaf9",
                      "error": "#ba1a1a",
                      "on-surface": "#002020",
                      "on-tertiary": "#ffffff",

<style>
        body { background-color: #F7F4EE; }
        .input-field:focus { border-color: #0F6B6B; outline: none; box-shadow: 0 0 0 1px #0F6B6B; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Main Registration Card -->
<main class="w-full max-w-md bg-surface-container-lowest border border-[#E6E1D8] rounded-xl p-8 sm:p-10 relative overflow-hidden">
<!-- Subtle Background Accent -->
<div class="absolute -top-16 -right-16 w-32 h-32 bg-primary-container opacity-10 rounded-full blur-2xl pointer-events-none"></div>
<div class="text-center mb-stack-md">
<!-- Brand Placeholder -->
<div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container-low text-primary mb-4">
<span class="material-symbols-outlined text-[28px]" data-icon="school">school</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Daftar</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Bergabung dengan SMART-TKA untuk persiapan akademik yang terarah.</p>
</div>
<form action="#" class="flex flex-col gap-stack-md relative z-10" method="POST">
<!-- Nama Tampilan -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="nama">Nama Tampilan</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="person">person</span>
<input class="input-field w-full pl-10 pr-4 py-3 rounded-lg border border-[#E6E1D8] bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" id="nama" name="nama" placeholder="Masukkan nama Anda" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="mail">mail</span>
<input class="input-field w-full pl-10 pr-4 py-3 rounded-lg border border-[#E6E1D8] bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" id="email" name="email" placeholder="contoh@email.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="lock">lock</span>
<input class="input-field w-full pl-10 pr-10 py-3 rounded-lg border border-[#E6E1D8] bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" id="password" name="password" placeholder="Minimal 8 karakter" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Note Text / Alert -->
<div class="bg-surface-container-high rounded-lg p-4 flex gap-3 items-start mt-2">
<span class="material-symbols-outlined text-primary-container shrink-0 mt-0.5" data-icon="info">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant m-0">
                    Jika diminta verifikasi, cek email. <br/>
<span class="font-label-md text-label-md opacity-80 block mt-1">Staging: admin bisa Auto-confirm.</span>
</p>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#0F6B6B] hover:bg-[#0b5454] text-white font-label-lg text-label-lg py-4 px-6 rounded-xl transition-all duration-200 active:scale-[0.98] mt-4 flex items-center justify-center gap-2 shadow-[0_4px_12px_rgba(11,61,61,0.08)]" type="submit">
                Daftar
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center pt-6 border-t border-[#E6E1D8]">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Sudah punya akun? 
                <a class="font-label-lg text-label-lg text-primary hover:text-primary-container transition-colors ml-1 underline decoration-primary/30 underline-offset-4" href="#">Masuk di sini</a>
</p>
</div>
</main>
<!-- Floating Graphic elements for background (Academic Context) -->
<div class="fixed top-20 left-20 opacity-20 pointer-events-none hidden lg:block">
<svg fill="none" height="120" stroke="#0F6B6B" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" viewbox="0 0 24 24" width="120">
<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
</svg>
</div>
<div class="fixed bottom-20 right-20 opacity-20 pointer-events-none hidden lg:block">
<svg fill="none" height="100" stroke="#7f5700" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" viewbox="0 0 24 24" width="100">
<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
</svg>
</div>
</body></html>
