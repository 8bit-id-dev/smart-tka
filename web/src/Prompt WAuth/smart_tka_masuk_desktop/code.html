<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Masuk - SMART-TKA</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-fixed-variant": "#004f50",
                      "primary-fixed": "#a3f0ef",
                      "on-secondary-fixed-variant": "#604100",
                      "on-error": "#ffffff",
                      "secondary-fixed": "#ffdeae",
                      "background": "#e2fffe",
                      "on-error-container": "#93000a",
                      "primary-fixed-dim": "#87d4d3",
                      "surface-dim": "#b4e3e2",
                      "surface-container-highest": "#bdebea",
                      "on-secondary-fixed": "#281900",
                      "on-background": "#002020",
                      "surface-container-lowest": "#ffffff",
                      "primary": "#005151",
                      "outline": "#6f7979",
                      "surface-variant": "#bdebea",
                      "on-tertiary-fixed-variant": "#005232",
                      "on-surface-variant": "#3f4948",
                      "on-secondary": "#ffffff",
                      "primary-container": "#0f6b6b",
                      "inverse-on-surface": "#cbfaf9",
                      "error": "#ba1a1a",
                      "on-surface": "#002020",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#005333",
                      "surface-bright": "#e2fffe",
                      "secondary": "#7f5700",
                      "surface-container": "#c8f7f6",
                      "inverse-surface": "#023737",
                      "surface": "#e2fffe",
                      "surface-container-low": "#cefdfc",
                      "error-container": "#ffdad6",
                      "on-tertiary-container": "#86f0b6",
                      "tertiary-fixed-dim": "#71dba2",
                      "on-primary": "#ffffff",
                      "secondary-container": "#feb62f",
                      "on-secondary-container": "#6d4a00",
                      "on-tertiary-fixed": "#002112",
                      "secondary-fixed-dim": "#ffba3e",
                      "surface-container-high": "#c2f1f0",
                      "tertiary-container": "#006e45",
                      "tertiary-fixed": "#8ef8bd",
                      "outline-variant": "#bec9c8",
                      "surface-tint": "#0b6969",
                      "on-primary-fixed": "#002020",
                      "inverse-primary": "#87d4d3",
                      "on-primary-container": "#9be9e8"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "unit": "4px",
                      "stack-md": "16px",
                      "section-gap": "40px",
                      "container-padding": "24px",
                      "stack-sm": "8px"
              },
              "fontFamily": {
                      "body-lg": ["Plus Jakarta Sans"],
                      "label-lg": ["Plus Jakarta Sans"],
                      "label-md": ["Plus Jakarta Sans"],
                      "body-md": ["Plus Jakarta Sans"],
                      "headline-md": ["Plus Jakarta Sans"],
                      "timer-tabular": ["Plus Jakarta Sans"],
                      "headline-lg": ["Plus Jakarta Sans"],
                      "display-lg": ["Plus Jakarta Sans"],
                      "headline-sm": ["Plus Jakarta Sans"],
                      "body-sm": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                      "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "timer-tabular": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "display-lg": ["48px", {"lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]

        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-[#F7F4EE] min-h-screen flex items-center justify-center p-gutter font-body-md text-on-surface">
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-outline-variant p-container-padding flex flex-col gap-section-gap">
<header class="text-center flex flex-col gap-stack-sm">
<h1 class="font-display-lg text-display-lg text-primary">SMART-TKA</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Siap TKA karena menguasai, bukan menebak.</p>
</header>
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault(); document.getElementById('error-message').classList.remove('hidden');">
<div class="hidden bg-error-container p-unit rounded-lg border border-error/20 flex items-center gap-unit px-3 py-2" id="error-message">
<span class="material-symbols-outlined text-error text-sm">error</span>
<p class="font-body-sm text-body-sm text-error">Email atau kata sandi salah</p>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-lg text-label-lg text-on-surface" for="email">Email</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="email" placeholder="nama@email.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-lg text-label-lg text-on-surface" for="password">Kata Sandi</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full bg-primary-container text-on-primary font-label-lg text-label-lg py-4 px-6 rounded-[12px] hover:bg-primary transition-colors mt-2 flex justify-center items-center gap-2" type="submit">
                Masuk
            </button>
<div class="flex items-center justify-center gap-unit mt-2">
<span class="font-body-sm text-body-sm text-on-surface-variant">Belum punya akun?</span>
<a class="font-label-lg text-label-lg text-primary hover:text-primary-container transition-colors" href="#">Daftar</a>
</div>
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-outline">atau</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-label-lg text-label-lg py-3 px-6 rounded-[12px] hover:bg-surface-container-low transition-colors flex justify-center items-center gap-2 opacity-50 cursor-not-allowed" type="button">
                Masuk dengan Google (menyusul)
            </button>
</form>
<footer class="text-center mt-4">
<p class="font-label-md text-label-md text-outline">Tidak berafiliasi dengan Kemendikdasmen.</p>
</footer>
</main>
</body></html>
