<style>
        /* Custom font import to ensure Plus Jakarta Sans loads */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Hide default radio circle, custom styling handled by JS classes */
        input[type="radio"] {
            display: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Task-Focused Header (Replacing TopNav for transactional intent) -->
<header class="bg-surface-container-lowest border-b border-outline-variant sticky top-0 z-40">
<div class="max-w-4xl mx-auto px-container-padding h-16 flex items-center justify-between">
<!-- Progress Context -->
<div class="flex items-center gap-3">
<button aria-label="Keluar latihan" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant">Penalaran Umum</span>
<span class="font-label-lg text-label-lg text-primary">Soal 1 dari 20</span>
</div>
</div>
<!-- Timer -->
<div class="flex items-center gap-2 bg-surface-container-low px-4 py-2 rounded-lg border border-outline-variant">
<span class="material-symbols-outlined text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">timer</span>
<div class="flex flex-col items-end">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Waktu Server</span>
<span class="font-timer-tabular text-timer-tabular text-primary">45:00</span>
</div>
</div>
</div>
<!-- Progress Bar (Visual indicator) -->
<div class="h-1 w-full bg-surface-variant">
<div class="h-full bg-primary w-[5%] transition-all duration-300"></div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto pb-24">
<div class="max-w-3xl mx-auto px-container-padding py-section-gap">
<!-- Question Card (Level 1 Surface) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 md:p-8 shadow-sm mb-stack-md relative">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-tertiary rounded-t-xl opacity-50"></div>
<h1 class="font-headline-sm text-headline-sm text-on-surface mb-stack-md flex items-start gap-3">
<span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-surface-variant text-primary font-label-lg mt-1 shrink-0">1</span>
<span class="leading-relaxed font-body-lg text-body-lg">
                        Hasil dari <span class="font-semibold">25% + 0.5</span> adalah...
                    </span>
</h1>
<!-- Optional: Image placeholder if questions usually have them -->
<!-- <img src="placeholder" data-alt="A clean, minimalist vector illustration representing a mathematical fraction or percentage visualization, using teal and warm grey tones on a white background, suitable for an academic testing platform." class="w-full max-w-md mx-auto rounded-lg mb-6 border border-outline-variant object-cover aspect-video hidden"> -->
</div>
<!-- Options Form -->
<form class="flex flex-col gap-unit" id="question-form">
<!-- Option A -->
<label class="option-card group relative flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer bg-surface-container-lowest hover:bg-surface-variant hover:border-outline transition-all duration-200">
<input class="peer" name="answer" type="radio" value="A"/>
<div class="w-10 h-10 rounded-full flex items-center justify-center font-label-lg text-label-lg bg-surface-container text-on-surface-variant border border-outline-variant group-hover:bg-surface-container-high transition-colors mr-4 shrink-0 option-badge">
                        A
                    </div>
<span class="font-body-md text-body-md text-on-surface flex-1">0.75</span>
<span class="material-symbols-outlined text-primary opacity-0 scale-50 transition-all duration-200 check-icon">check_circle</span>
</label>
<!-- Option B -->
<label class="option-card group relative flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer bg-surface-container-lowest hover:bg-surface-variant hover:border-outline transition-all duration-200">
<input class="peer" name="answer" type="radio" value="B"/>
<div class="w-10 h-10 rounded-full flex items-center justify-center font-label-lg text-label-lg bg-surface-container text-on-surface-variant border border-outline-variant group-hover:bg-surface-container-high transition-colors mr-4 shrink-0 option-badge">
                        B
                    </div>
<span class="font-body-md text-body-md text-on-surface flex-1">1.0</span>
<span class="material-symbols-outlined text-primary opacity-0 scale-50 transition-all duration-200 check-icon">check_circle</span>
</label>
<!-- Option C -->
<label class="option-card group relative flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer bg-surface-container-lowest hover:bg-surface-variant hover:border-outline transition-all duration-200">
<input class="peer" name="answer" type="radio" value="C"/>
<div class="w-10 h-10 rounded-full flex items-center justify-center font-label-lg text-label-lg bg-surface-container text-on-surface-variant border border-outline-variant group-hover:bg-surface-container-high transition-colors mr-4 shrink-0 option-badge">
                        C
                    </div>
<span class="font-body-md text-body-md text-on-surface flex-1">1.25</span>
<span class="material-symbols-outlined text-primary opacity-0 scale-50 transition-all duration-200 check-icon">check_circle</span>
</label>
<!-- Option D -->
<label class="option-card group relative flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer bg-surface-container-lowest hover:bg-surface-variant hover:border-outline transition-all duration-200">
<input class="peer" name="answer" type="radio" value="D"/>
<div class="w-10 h-10 rounded-full flex items-center justify-center font-label-lg text-label-lg bg-surface-container text-on-surface-variant border border-outline-variant group-hover:bg-surface-container-high transition-colors mr-4 shrink-0 option-badge">
                        D
                    </div>
<span class="font-body-md text-body-md text-on-surface flex-1">0.5</span>
<span class="material-symbols-outlined text-primary opacity-0 scale-50 transition-all duration-200 check-icon">check_circle</span>
</label>
</form>
</div>
</main>
<!-- Bottom Action Bar (Sticky) -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-outline-variant shadow-[0_-4px_12px_rgba(11,61,61,0.08)] z-50">
<div class="max-w-4xl mx-auto px-container-padding py-4 flex items-center justify-between gap-4">
<!-- Left Action -->
<button class="px-6 py-3 border border-outline-variant rounded-lg font-label-lg text-label-lg text-on-surface-variant bg-surface opacity-50 cursor-not-allowed flex items-center gap-2" disabled="">
<span class="material-symbols-outlined text-sm">arrow_back</span>
<span class="hidden sm:inline">Sebelumnya</span>
</button>
<!-- Right Actions -->
<div class="flex items-center gap-3">
<!-- Secondary / Default Next Action -->
<button class="px-6 py-3 border border-outline-variant rounded-lg font-label-lg text-label-lg text-on-surface-variant bg-surface opacity-50 cursor-not-allowed flex items-center gap-2" disabled="">
<span class="hidden sm:inline">Selanjutnya</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<!-- Primary Action (Revealed via JS) -->
<button class="hidden px-8 py-3 bg-primary text-on-primary rounded-lg font-label-lg text-label-lg shadow-md hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all flex items-center gap-2" id="btn-submit">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
                    Kunci Jawaban
                </button>
</div>
</div>
</div>
<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('question-form');
            const submitBtn = document.getElementById('btn-submit');
            const optionCards = document.querySelectorAll('.option-card');

            form.addEventListener('change', (e) => {
                if (e.target.name === 'answer') {
                    // Show primary action button
                    submitBtn.classList.remove('hidden');
                    // Optional: animate in
                    submitBtn.classList.add('animate-fade-in-up');

                    // Reset all cards styling
                    optionCards.forEach(card => {
                        // Reset borders and backgrounds
                        card.classList.remove('border-primary', 'bg-surface-dim', 'shadow-sm');
                        card.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                        
                        // Reset badges
                        const badge = card.querySelector('.option-badge');
                        badge.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary');
                        badge.classList.add('bg-surface-container', 'text-on-surface-variant', 'border-outline-variant');

                        // Hide check icon
                        const icon = card.querySelector('.check-icon');
                        icon.classList.remove('opacity-100', 'scale-100');
                        icon.classList.add('opacity-0', 'scale-50');
                    });

                    // Apply styling to selected card
                    const selectedCard = e.target.closest('.option-card');
                    selectedCard.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                    selectedCard.classList.add('border-primary', 'bg-surface-dim', 'shadow-sm');
                    
                    const selectedBadge = selectedCard.querySelector('.option-badge');
                    selectedBadge.classList.remove('bg-surface-container', 'text-on-surface-variant', 'border-outline-variant');
                    selectedBadge.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');

                    const selectedIcon = selectedCard.querySelector('.check-icon');
                    selectedIcon.classList.remove('opacity-0', 'scale-50');
                    selectedIcon.classList.add('opacity-100', 'scale-100');
                }
            });
        });
    </script>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }
    </style>
</body></html>
